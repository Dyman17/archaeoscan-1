<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏺 ArchaeoScan - Мониторинг дрона</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .main {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: rgba(255,255,255,255,0.1);
            border: 1px solid rgba(255,255,255,255,0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .status-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4ade80;
        }
        
        .status-value {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .status-info {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 10px;
        }
        
        .controls {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }
        
        .control-btn {
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        
        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .api-status {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        
        @media (max-width: 768px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .control-btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏺 ArchaeoScan</h1>
        <p>Система мониторинга археологических раскопок</p>
    </div>
    
    <div class="main">
        <div class="status-grid">
            <!-- ESP32 Статус -->
            <div class="status-card">
                <div class="status-title">📡 ESP32 Датчики</div>
                <div class="status-value" id="esp32-status">Проверка...</div>
                <div class="status-info" id="esp32-info">Ожидание подключения</div>
            </div>
            
            <!-- GPS Координаты -->
            <div class="status-card">
                <div class="status-title">📍 GPS Координаты</div>
                <div class="status-value" id="gps-coords">---.---</div>
                <div class="status-info" id="gps-info">Нет данных</div>
            </div>
            
            <!-- Глубина -->
            <div class="status-card">
                <div class="status-title">📏 Глубина</div>
                <div class="status-value" id="depth-value">--- м</div>
                <div class="status-info" id="depth-info">Нет данных</div>
            </div>
            
            <!-- Preservation Index -->
            <div class="status-card">
                <div class="status-title">🛡️ Индекс сохранности</div>
                <div class="status-value" id="preservation-value">---%</div>
                <div class="status-info" id="preservation-info">Нет данных</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="status-title">🎛️ Управление</div>
            <button class="control-btn" onclick="checkESP32()">🔄 Проверить ESP32</button>
            <button class="control-btn" onclick="startMonitoring()">▶️ Начать мониторинг</button>
            <button class="control-btn" onclick="stopMonitoring()">⏹️ Остановить</button>
            <button class="control-btn" onclick="analyzeMaterial()">🔬 Анализ материала</button>
        </div>
        
        <div class="api-status" id="api-status">
            <div>📡 API Статус: <span id="api-status-text">Проверка...</span></div>
            <div>🌐 Сервер: <span id="server-info">localhost:8000</span></div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let monitoring = false;
        let esp32Data = {};
        
        // WebSocket подключение
        function connectWebSocket() {
            try {
                // Определяем WebSocket URL в зависимости от окружения
                let wsUrl;
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    wsUrl = 'ws://localhost:8000/ws';
                } else {
                    wsUrl = 'wss://' + window.location.hostname + '/ws';
                }
                
                console.log('Connecting to WebSocket:', wsUrl);
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    console.log('WebSocket connected successfully');
                    updateStatus('esp32-status', '🟢 Подключено', 'success');
                    updateStatus('api-status-text', 'WebSocket подключен', 'success');
                    updateStatus('esp32-info', 'Ожидание данных от ESP32...', 'info');
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    console.log('Получены данные:', data);
                    
                    if (data.type === 'sensor_data' && data.data) {
                        esp32Data = data.data;
                        console.log('ESP32 данные обновлены:', esp32Data);
                        updateESP32Display();
                        updateStatus('esp32-info', 'Данные получены: ' + new Date().toLocaleTimeString(), 'success');
                    }
                };
                
                ws.onclose = function() {
                    console.log('WebSocket disconnected');
                    updateStatus('esp32-status', '🔴 Отключено', 'error');
                    updateStatus('api-status-text', 'WebSocket отключен', 'error');
                    updateStatus('esp32-info', 'Потеряно соединение', 'error');
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    updateStatus('esp32-status', '❌ Ошибка', 'error');
                    updateStatus('api-status-text', 'Ошибка WebSocket', 'error');
                    updateStatus('esp32-info', 'Ошибка подключения', 'error');
                };
            } catch (error) {
                console.error('Ошибка WebSocket:', error);
                updateStatus('esp32-status', '❌ Ошибка', 'error');
            }
        }
        
        // Обновление статуса
        function updateStatus(elementId, text, type = 'info') {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = text;
                element.className = element.className.replace(/success|error|warning/g, type);
            }
        }
        
        // Обновление данных ESP32
        function updateESP32Display() {
            if (esp32Data.sensors) {
                const sensors = esp32Data.sensors;
                
                // GPS
                if (sensors.gps && (sensors.gps.lat || sensors.gps.latitude)) {
                    const lat = sensors.gps.lat || sensors.gps.latitude;
                    const lng = sensors.gps.lng || sensors.gps.longitude;
                    updateStatus('gps-coords', `${lat.toFixed(6)}, ${lng.toFixed(6)}`, 'success');
                    updateStatus('gps-info', `Точность: ±${sensors.gps.accuracy || 2}м`, 'info');
                }
                
                // Глубина
                if (sensors.distance) {
                    updateStatus('depth-value', `${sensors.distance.toFixed(1)} м`, 'success');
                    updateStatus('depth-info', `Последнее: ${new Date().toLocaleTimeString()}`, 'info');
                }
                
                // Preservation
                if (sensors.preservation !== undefined) {
                    const preservation = typeof sensors.preservation === 'number' ? sensors.preservation : sensors.preservation.water_preservation;
                    updateStatus('preservation-value', `${preservation.toFixed(1)}%`, 'success');
                    updateStatus('preservation-info', `Вода: ${preservation > 70 ? 'Хорошая' : preservation > 40 ? 'Умеренная' : 'Плохая'}`, 'info');
                }
            }
        }
        
        // Проверка ESP32
        function checkESP32() {
            fetch('/api/esp32/status')
                .then(response => response.json())
                .then(data => {
                    updateStatus('esp32-status', data.status === 'ok' ? '🟢 Активен' : '🔴 Неактивен', data.status === 'ok' ? 'success' : 'error');
                    updateStatus('esp32-info', `Последняя активность: ${new Date(data.timestamp * 1000).toLocaleString()}`, 'info');
                })
                .catch(error => {
                    updateStatus('esp32-status', '❌ Ошибка', 'error');
                    updateStatus('esp32-info', 'Ошибка проверки', 'error');
                });
        }
        
        // Начать мониторинг
        function startMonitoring() {
            monitoring = true;
            connectWebSocket();
            updateStatus('api-status-text', 'Мониторинг активен', 'success');
        }
        
        // Остановить мониторинг
        function stopMonitoring() {
            monitoring = false;
            if (ws) {
                ws.close();
            }
            updateStatus('api-status-text', 'Мониторинг остановлен', 'warning');
        }
        
        // Анализ материала
        function analyzeMaterial() {
            fetch('/api/ai/analyze')
                .then(response => response.json())
                .then(data => {
                    alert(`🔬 Результаты анализа:\n\nВода: ${data.water_analysis.preservation}% сохранности\nМатериал: ${data.material_identification.material}\nТочность: ${data.material_identification.confidence}%`);
                })
                .catch(error => {
                    alert('❌ Ошибка анализа: ' + error.message);
                });
        }
        
        // Автозапуск
        window.onload = function() {
            updateStatus('server-info', window.location.hostname + ':8000', 'info');
            connectWebSocket();
            startMonitoring();
            
            // Автопроверка каждые 30 секунд
            setInterval(() => {
                if (monitoring && ws && ws.readyState === WebSocket.OPEN) {
                    checkESP32();
                }
            }, 30000);
        };
    </script>
</body>
</html>
